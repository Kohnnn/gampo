name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Ordering rationale (Phase 3, extended Phase 5):
      # cheapest and most specific gates first, so a regression is caught before
      # any test bootstrap or build artefact costs CI minutes.

      - name: Real-money wording scan
        run: npm run wording:scan

      - name: ESLint (ratchet — fails only on NEW findings)
        run: npm run lint:ratchet

      # Phase 5: the RNG intent gate is the ONLY thing that catches a
      # payout-shaped Math.random() inside an exemption-listed file. ESLint
      # alone reports nothing there by design, so without this step the Phase 4
      # guard is unenforced on main.
      - name: RNG intent gate (per-call-site annotations + count lock)
        run: npm run lint:rng-intent

      # Phase 5: the guards are only trustworthy if their own self-tests run.
      # Each of these proves its gate still FAILS on a planted violation, which
      # a green gate alone cannot demonstrate.
      - name: Guard self-tests (prove each gate still bites)
        run: |
          npm run wording:scan:test
          npm run lint:rng-test
          npm run lint:rng-intent-test
          npm run lint:ratchet:test
          npm run lint:react-test

      # Phase 5: checker-only TypeScript over a small set of pure math/payout
      # modules. Bounded by an explicit include list in tsconfig.core.json.
      - name: Thin type check (pure core modules only)
        run: npm run typecheck:core

      - name: Type-lane boundary test (proves it is real AND narrow)
        run: npm run typecheck:core-test

      # The full suite runs here on purpose. `test:ci:fast` exists as a local
      # fast-feedback command, but the full run is only ~16s and the two files
      # it would skip (slotFactory, slotRtp) are exactly the slot payout math —
      # the last thing that should lose CI coverage to save a few seconds.
      - run: npm test

      - run: npm run build

      # Slots Phase 4: must run AFTER build — it inspects real bundle output.
      #
      # SlotsGame.jsx exposes window.__gampoSlotQa, whose forceBonusState() sets
      # freeSpins; a free spin takes the `stake === 0` path in performSpin and
      # skips placeBet entirely. Shipped, that is free credits from the console.
      # It DID ship until this gate existed. The seam is stripped by an
      # `import.meta.env.DEV` check, which Vite statically eliminates — but
      # swapping it for a runtime check still works in dev, still passes every
      # unit test, and silently re-emits the seam. Only the built artefact
      # proves absence, so this cannot move above `npm run build`.
      - name: QA-seam production absence (inspects built output)
        run: npm run guard:qa-seam

      - name: QA-seam guard self-test (proves it bites on a planted leak)
        run: npm run guard:qa-seam-test

      - run: npm audit --omit=dev --audit-level=high
